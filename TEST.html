<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#0B0F14">
    <meta name="robots" content="noindex, nofollow">

    <title>SPRK Network — Checkout</title>
    <meta name="description" content="SPRK Network VIP Membership Checkout">

    <!-- Open Graph -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.sprknetwork.com/checkout" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SPRK Network VIP Membership" />
    <meta property="og:description" content="Join the SPRK Network VIP — $1 for 30 days, then $37/month" />
    <meta property="og:site_name" content="SPRK Network" />

    <!-- Favicon (use your own) -->
    <link rel="icon" type="image/png" href="https://www.sprknetwork.com/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FanBasis Embedded Checkout SDK -->
    <script src="https://cdn.embedded.fanbasis.io/embed/index.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0B0F14;
            color: #E5E7EB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0;
        }

        /* ===== CHECKOUT WRAPPER ===== */
        .checkout-wrapper {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        /* ===== CHECKOUT CONTAINER ===== */
        #checkout-container {
            width: 100%;
            min-height: 920px;
            border-radius: 12px;
            overflow: visible;
            position: relative;
        }

        #checkout-container .checkout-loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }

        #checkout-container iframe {
            position: relative;
            z-index: 2;
            width: 100% !important;
            height: 920px !important;
            border: none !important;
        }

        @media (max-width: 640px) {
            #checkout-container iframe {
                height: 1200px !important;
            }
        }

        /* ===== TERMS SECTION (below the checkout) ===== */
        .terms-section {
            margin-top: 28px;
            padding: 0 4px;
        }

        .terms-fanbasis-notice {
            font-size: 13px;
            color: #9CA3AF;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .terms-checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
        }

        .terms-checkbox-row input[type="checkbox"] {
            margin-top: 3px;
            width: 16px;
            height: 16px;
            accent-color: #4c44ec;
            flex-shrink: 0;
            cursor: pointer;
        }

        .terms-checkbox-row label {
            font-size: 13px;
            color: #9CA3AF;
            line-height: 1.65;
            cursor: pointer;
        }

        .terms-checkbox-row label a {
            color: #34d399;
            text-decoration: none;
        }

        .terms-checkbox-row label a:hover {
            text-decoration: underline;
        }

        /* ===== POWERED BY ===== */
        .powered-by {
            text-align: right;
            margin-top: 12px;
            font-size: 12px;
            color: #6B7280;
        }

        .powered-by a {
            color: #FD3363;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== STATEMENT NOTE ===== */
        .statement-note {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #6B7280;
        }

        /* ===== LOADING STATE ===== */
        .checkout-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .checkout-loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(229, 209, 154, 0.2);
            border-top: 3px solid #E5D19A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .checkout-wrapper {
                padding: 20px 12px 40px;
            }

            #checkout-container {
                min-height: 900px;
            }
        }
    </style>
</head>
<body>

    <div class="checkout-wrapper">

        <!-- FanBasis Embedded Checkout -->
        <div id="checkout-container">
            <div class="checkout-loading">
                <div class="spinner"></div>
                <span>Loading checkout...</span>
            </div>
        </div>

        <!-- Terms & Conditions (matching Jacob's style) -->
        <div class="terms-section">
            <div class="terms-checkbox-row">
                <input type="checkbox" id="terms-checkbox">
                <label for="terms-checkbox">
                    By purchasing, I agree to getting my store and community access for 30
                    days for $1. I understand I can cancel my SPRK subscription by creating a
                    support ticket at anytime. Or when I love it, I can keep it after the trial for
                    just $37 per month. I have read and agree to the
                    <a href="https://www.sprknetwork.com/terms-of-service" target="_blank">Terms of service</a>, Terms of
                    Purchase, and <a href="https://www.sprknetwork.com/privacy-policy" target="_blank">Privacy</a> Statement.
                </label>
            </div>

            <p class="statement-note">
                Your statement will show a charge from Fanbasis.com
            </p>
        </div>
    </div>

    <!-- Initialize FanBasis Embedded Checkout -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Configuration for SPRK Network checkout
            const config = {
                creatorId: 'sprk-network',
                productId: '60XK9',
                checkoutSessionSecret: '87abe08e-6b0f-490e-b9b6-ce8d795bc013',
                environment: 'production',
                theme: {
                    theme: 'dark',
                    accent_color: '#E5D19A',
                    show_product_info: true,
                    product_layout: 'left',
                    show_coupon_row: false,
                    background_color: '#0B0F14',
                    label_color: '#E5E7EB',
                    input_background_color: '#111827',
                    product_text_color: '#E5E7EB',
                    heading_color: '#E5E7EB',
                    secondary_color: '#9CA3AF',
                    border_color: 'rgba(229,231,235,0.15)',
                    surface_color: '#111827'
                }
            };

            try {
                // Clear loading indicator
                document.getElementById('checkout-container').innerHTML = '';
                const checkout = PaymentCheckout.create(config);
                checkout.attachToElement(document.getElementById('checkout-container'));
                checkout.init();
            } catch (err) {
                console.error('FanBasis Checkout Error:', err);
                document.getElementById('checkout-container').innerHTML =
                    '<div class="checkout-loading" style="color:#EF4444;">Failed to load checkout. Please refresh the page.</div>';
            }
        });
    </script>

</body>
</html>
