      <h1 class="apply__h welcome__h" id="welcome-h">

  <!-- ═══ Personalisation ══════════════════════════════════════
       Reads ?n= and writes it into the heading via textContent, never
       innerHTML. The value arrives in a URL and is treated as hostile.
  ══════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    var MAX = 28;

    var greeting = document.getElementById('welcome-greeting');
    if (!greeting) return;

    var raw = '';
    try { raw = new URLSearchParams(window.location.search).get('n') || ''; } catch (e) { raw = ''; }

    /* If the value contains angle brackets it is markup or an injection
       attempt, not a name. Stripping the characters would still leave
       "Welcome, Scriptalertscript" on screen — safe, but nonsense. Drop
       the whole value and show the clean no-name heading instead. */
    if (/[<>]/.test(raw)) raw = '';

    /* Unicode-aware allowlist: letters (any script, so accented and
       non-Latin names survive), marks (combining accents), space,
       apostrophe, hyphen. Everything else is dropped — which is what
       makes <script> collapse to harmless text rather than markup.
       \p{L}/\p{M} need the u flag; browsers without it fall back to a
       Latin-only class, which still strips every markup character. */
    var cleaned;
    try {
      cleaned = raw.replace(/[^\p{L}\p{M}\s'\-]/gu, '');
    } catch (e) {
      cleaned = raw.replace(/[^A-Za-zÀ-ɏ\s'\-]/g, '');
    }

    cleaned = cleaned.replace(/\s+/g, ' ').trim().slice(0, MAX).trim();

    if (!cleaned) return;   // leave the served default: "Welcome to SPRK Network"

    /* Title-case each word, including the parts of hyphenated and
       apostrophed names (mary-jane -> Mary-Jane, o'brien -> O'Brien). */
    var name = cleaned.toLowerCase().replace(/(^|[\s'\-])(\p{L})/gu, function (m, sep, ch) {
      return sep + ch.toUpperCase();
    });

    greeting.textContent = 'Welcome, ' + name;
    document.title = 'Welcome, ' + name + ' — SPRK Network';
  })();
  </script>
