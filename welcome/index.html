<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Welcome — SPRK Network</title>
  <meta name="description" content="Your call with SPRK Network is booked. Watch this before we speak." />
  <meta name="theme-color" content="#0B0F14" />

  <!-- Personal page for a single booked lead, reached only from an SMS
       link. Never a search result. -->
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="/images/Sprknetwork.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://videodelivery.net" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://connect.facebook.net" />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/styles.css" />

  <!-- ═══ Scrub ?n= BEFORE the pixel loads ═════════════════════
       fbevents.js sends the full document location as its `dl`
       parameter on every event. This page is only ever opened as
       /welcome?n=Caryn, so without this the lead's FIRST NAME is
       transmitted to Meta on PageView and PreCallView, keyed to their
       _fbp. That is customer PII in an ad platform: a Business Tools
       terms violation and an event-rejection risk on the ad account
       the whole funnel runs through.

       Must stay above the pixel block and inside <head> — it only
       works if it runs before fbq reads location.

       Accepted trade: after the scrub a reload or bookmark has no
       name, so the heading falls back to "Welcome to SPRK Network".
       Losing personalisation on a refresh beats leaking a name. -->
  <script>
  window.__sprkName = '';
  try {
    var _p = new URLSearchParams(window.location.search);
    window.__sprkName = _p.get('n') || '';
    if (_p.has('n') && window.history && history.replaceState) {
      _p.delete('n');
      var _q = _p.toString();
      history.replaceState(null, '', window.location.pathname + (_q ? '?' + _q : '') + window.location.hash);
    }
  } catch (e) { window.__sprkName = ''; }
  </script>

  <!-- ═══ Meta Pixel ═══════════════════════════════════════════
       Its own block, firing its own PageView. Deliberately not shared
       with the other pages — see the note in /form. -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window,document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  /* MUST precede init. Scrubbing ?n= off the URL is not sufficient on its
     own: with autoConfig left on, the pixel also harvests page metadata and
     ships the document title as pmd[title] plus a page_title entry in ss.
     Since the title carries the lead's name by design, that put the name
     back on the wire through a second channel. Verified against live
     beacons — with this off, neither pmd[title] nor ss is sent.

     Safe here specifically: autoConfig drives automatic advanced matching,
     which scrapes form fields for emails and phone numbers. This page has
     no form. Do NOT copy this line to /form, which needs the default. */
  fbq('set', 'autoConfig', false, '1746915513340219');

  fbq('init', '1746915513340219');
  fbq('track', 'PageView');
  // Booked leads who never open this are the no-show risk; the sales team
  // uses this against the booking count.
  fbq('trackCustom', 'PreCallView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1746915513340219&ev=PageView&noscript=1" alt="" /></noscript>
  <!-- ═══ End Meta Pixel ═══════════════════════════════════════ -->
</head>
<body class="formpage">

  <div class="ambient" aria-hidden="true">
    <div class="bloom bloom--1"></div>
    <div class="bloom bloom--2"></div>
    <div class="grid-lines"></div>
    <div class="grain"></div>
  </div>

  <main class="apply welcome" id="main">

    <header class="apply__head">
      <!-- The greeting line is emptied by script when there is no ?n=, so the
           heading reads "Welcome to SPRK Network" rather than leaving a comma
           and a gap. Server-rendered default is the no-name version. -->
      <h1 class="apply__h welcome__h" id="welcome-h">
        <span class="welcome__greeting" id="welcome-greeting">Welcome</span>
        <span class="welcome__line2">to <em>SPRK Network</em></span>
      </h1>

      <p class="section-eyebrow">Your call is booked</p>
    </header>

    <!-- ═══════════════════════════════════════════════════════════
         VIDEO — Cloudflare Stream, played through a native <video>.

         Deliberately NOT Cloudflare's iframe embed. A plain video element
         means no vendor logo, no vendor control bar, and — more usefully —
         playback events are readable directly instead of across an iframe
         boundary, which is what makes the watch-depth tracking below work.

         TO SWAP THE VIDEO: change CF_VIDEO_ID in the script at the bottom
         of this file. Nothing here needs touching — the poster and the
         source are both derived from it.
    ═══════════════════════════════════════════════════════════ -->
    <div class="frame welcome__frame">
      <div class="frame__inner" id="welcome-video">
        <video
          id="precall-video"
          class="welcome__video"
          controls
          playsinline
          preload="metadata"
          poster="https://videodelivery.net/7fbaac96008ffb840d46378f7e8c5cd1/thumbnails/thumbnail.jpg?time=8s&amp;width=1280"
        ></video>

        <!-- Shown by the script if the stream cannot be attached at all. -->
        <p class="welcome__novideo" role="alert">
          The video didn't load — your connection or an extension may be blocking it.
          We'll walk you through everything on the call.
        </p>
        <noscript><p class="welcome__novideo welcome__novideo--js">This video needs JavaScript. We'll cover it on the call.</p></noscript>
      </div>
    </div>

    <p class="welcome__lead welcome__lead--after">
      That video covers how the network actually works, so we can spend the
      call on your situation instead of the basics.
    </p>

  </main>

  <!-- ═══ Personalisation ══════════════════════════════════════
       Reads ?n= and writes it into the heading via textContent, never
       innerHTML. The value arrives in a URL and is treated as hostile.
  ══════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    var MAX = 28;

    var greeting = document.getElementById('welcome-greeting');
    if (!greeting) return;

    /* The head script scrubbed ?n= off the URL before the pixel fired and
       stashed the raw value here. Reading the URL is only a fallback for
       the case where that script was skipped. */
    var raw = '';
    try {
      raw = (typeof window.__sprkName === 'string' && window.__sprkName) ||
            new URLSearchParams(window.location.search).get('n') || '';
    } catch (e) { raw = ''; }

    /* Angle brackets mean markup or an injection attempt, not a name.
       Stripping the characters would still leave "Welcome, Scriptalertscript"
       on screen — safe, but nonsense. Drop the whole value. */
    if (/[<>]/.test(raw)) raw = '';

    /* Fold typographic punctuation to ASCII first. iOS and most CRM and
       booking forms auto-substitute ' with U+2019, which is neither a
       letter nor a mark — without this, O’Brien became Obrien. */
    raw = raw.replace(/[‘’ʼ′]/g, "'")
             .replace(/[‐‑‒–—−]/g, '-');

    /* Built with new RegExp, NOT literals. An unsupported \p{...} inside a
       regex literal is a PARSE-time SyntaxError, which kills this entire
       script before any try block is reached — so a literal-based fallback
       can never run. The constructor throws at runtime, which is catchable. */
    var allow, boundary, hasLetter;
    try {
      allow     = new RegExp("[^\\p{L}\\p{M}\\s'\\-]", 'gu');
      boundary  = new RegExp("(^|[\\s'\\-])(\\p{L})", 'gu');
      hasLetter = new RegExp("\\p{L}", 'u');
    } catch (e) {
      allow     = /[^A-Za-zÀ-ɏ\s'\-]/g;
      boundary  = /(^|[\s'\-])([A-Za-zÀ-ɏ])/g;
      hasLetter = /[A-Za-zÀ-ɏ]/;
    }

    var cleaned = raw.replace(allow, '').replace(/\s+/g, ' ').trim();

    /* Cap by CODE POINT, not UTF-16 unit: an astral letter is two units, so
       a raw slice can halve one and render a replacement glyph. */
    cleaned = Array.from(cleaned).slice(0, MAX).join('');

    /* The cap can land on a separator, and "-Caryn" needs the same trim. */
    cleaned = cleaned.replace(/^[\s'\-]+|[\s'\-]+$/g, '');

    /* Must contain a real letter. Hyphens and apostrophes are allowlisted, so
       "---" or a stray "555-1234" is non-empty but is not a name — an SMS
       platform rendering an empty merge field would otherwise print
       "Welcome, -". Fall through to the served no-name heading. */
    if (!hasLetter.test(cleaned)) return;

    /* Title-case, but only re-case a token that is entirely lower or entirely
       upper. That fixes shouted input (CARYN -> Caryn) without flattening the
       medial capital in DeShawn, LaToya or McDonald. */
    var name = cleaned.split(' ').map(function (tok) {
      var t = (tok === tok.toLowerCase() || tok === tok.toUpperCase()) ? tok.toLowerCase() : tok;
      return t.replace(boundary, function (m, sep, ch) { return sep + ch.toUpperCase(); });
    }).join(' ');

    greeting.textContent = 'Welcome, ' + name;
    document.title = 'Welcome, ' + name + ' — SPRK Network';
  })();


  </script>

  <!-- ═══ Player ═══════════════════════════════════════════════
       Cloudflare Stream serves HLS. A plain <video> is used rather than
       Cloudflare's iframe embed so there is no vendor logo and no vendor
       control bar.

       QUALITY IS PINNED TO THE TOP RUNG. Cloudflare encoded a
       1080/720/480/360/240 ladder and hls.js would normally pick a rung
       from measured bandwidth, which is why a good connection could still
       open at 360p for the first few seconds. Locking to the highest
       level means it is always 1080p — at the cost of buffering instead
       of degrading when the connection genuinely cannot carry ~2.9 Mbps.

       hls.js is preferred wherever it is supported, INCLUDING Safari,
       because native HLS gives no API to pin the level. On iOS below 17.1
       there is no MSE, so the native player takes over and picks its own
       quality — that path cannot be controlled from here.

       TO SWAP THE VIDEO: change CF_VIDEO_ID. Poster and source derive
       from it.
  ══════════════════════════════════════════════════════════════ -->
  <script>
  (function () {
    var CF_VIDEO_ID = '7fbaac96008ffb840d46378f7e8c5cd1';
    var SRC = 'https://videodelivery.net/' + CF_VIDEO_ID + '/manifest/video.m3u8';

    var video = document.getElementById('precall-video');
    var box   = document.getElementById('welcome-video');
    if (!video || !box) return;

    function fail() { box.setAttribute('data-state', 'failed'); }

    function useNative() {
      video.src = SRC;
      video.addEventListener('error', fail, { once: true });
    }

    var tag = document.createElement('script');
    tag.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';

    // If hls.js cannot be fetched, fall back to native HLS where the
    // browser supports it rather than showing the failure panel.
    tag.onerror = function () {
      if (video.canPlayType('application/vnd.apple.mpegurl')) useNative(); else fail();
    };

    tag.onload = function () {
      if (!window.Hls || !window.Hls.isSupported()) {
        if (video.canPlayType('application/vnd.apple.mpegurl')) useNative(); else fail();
        return;
      }
      var hls = new window.Hls({
        capLevelToPlayerSize: false,  // do not let the element's CSS size cap quality
        startLevel: -1                // replaced with the top rung once levels are known
      });
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
        var top = hls.levels.length - 1;
        hls.startLevel = top;
        hls.currentLevel = top;       // pin it; -1 would hand control back to ABR
        hls.autoLevelCapping = -1;
      });
      hls.on(window.Hls.Events.ERROR, function (_e, data) { if (data && data.fatal) fail(); });
      hls.loadSource(SRC);
      hls.attachMedia(video);
    };

    document.head.appendChild(tag);

    /* Nothing buffered after 12s means the stream never came up. */
    setTimeout(function () {
      if (!video.readyState && box.getAttribute('data-state') !== 'failed') fail();
    }, 12000);
  })();
  </script>

</body>
</html>
